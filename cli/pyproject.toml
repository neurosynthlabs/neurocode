[project]
name = "neurocode-cli"
version = "0.1.0"
description = "nc — NeuroCode in the terminal: sessions, plans, approvals, runs and memory, against any NeuroCode server."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "keyring>=25",
    "rich>=13.7",
    "textual>=0.80",
    "typer>=0.12",
]

[project.scripts]
nc = "neurocode_cli.main:run"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["neurocode_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
