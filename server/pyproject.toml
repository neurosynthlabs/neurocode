[project]
name = "neurocode-api"
version = "0.1.0"
description = "Local-first API for NeuroCode: FastAPI over Postgres (SQLAlchemy, Alembic, pgvector), run on your own machine."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "debugpy>=1.8.22",
    "duckdb>=1.2",
    "fastapi>=0.115",
    "httpx>=0.27",
    "jupyter-client>=8.6",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.0",
    "tree-sitter>=0.24",
    "tree-sitter-language-pack>=0.13,<1",
    "uvicorn>=0.30",
    "websockets>=17.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.4.0",
    "ipykernel>=6.29",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# `async def test_…` runs without a decorator on every test; fixtures say so for themselves.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Starlette's TestClient warns about its own dependencies; nothing in this code base triggers these.
filterwarnings = [
    "ignore:Using .httpx. with .starlette.testclient. is deprecated",
    "ignore:The anyio.abc.BlockingPortal alias is deprecated",
]
