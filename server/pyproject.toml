[project]
name = "neurocode-api"
version = "0.1.0"
description = "Local-first API for NeuroCode: FastAPI over SQLite + FTS5. No external services."
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
